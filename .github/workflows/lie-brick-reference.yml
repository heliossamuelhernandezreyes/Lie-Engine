name: LIE brick versus independent Cycles reference
on:
  push:
    branches: [work/lie-brick-reference]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lie-brick-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: tools
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Complete CPU regressions and generated shader identity
        run: |
          python -m pip install --timeout 20 --retries 2 -r requirements-ci.txt
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tools/lie_brick_reference_shader.py
          git diff --exit-code -- gpu_compute/shaders
      - name: Bounded official renderers and software Vulkan setup
        run: |
          timeout 180s sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
          timeout 180s sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libsm6 libgl1 libegl1 libxkbcommon0
          curl --fail --location --retry 2 --max-time 180 -o blender.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          curl --fail --location --retry 2 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender4.3/blender-4.3.2.sha256
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected=next(row.split()[0] for row in Path('blender.sha256').read_text().splitlines() if row.strip().endswith('blender-4.3.2-linux-x64.tar.xz'))
          assert hashlib.sha256(Path('blender.tar.xz').read_bytes()).hexdigest()==expected
          PY
          mkdir blender-bin
          tar -xf blender.tar.xz -C blender-bin --strip-components=1
          curl --fail --location --retry 2 --max-time 90 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Same LIE-28 master, neutral captures and independent Cycles renders
        run: |
          set -o pipefail
          timeout 600 blender-bin/blender -b -t 4 --python tools/lie_brick_reference_blender.py -- --output /tmp/brick-fixture --resolution 256 --samples 512 --capture-resolution 128 2>&1 | tee brick-source.log
          python tools/lie_brick_reference_verify.py --fixture /tmp/brick-fixture | tee brick-source-verification.log
          python tools/lie_brick_reference_stage.py --fixture /tmp/brick-fixture --stage /tmp/brick-stage
      - name: Actual captured camera, shared field, commands and source lifetime
        run: |
          set -o pipefail
          engine="$PWD/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          timeout 90 "$engine" --headless --path /tmp/brick-stage --editor --import --quit 2>&1 | tee brick-import.log
          timeout 60 "$engine" --headless --path /tmp/brick-stage --script res://test_lie26_rig.gd 2>&1 | tee brick-rig.log
          timeout 60 "$engine" --headless --path /tmp/brick-stage --script res://workshop/test_lie_agent_session.gd 2>&1 | tee brick-agent.log
          timeout 360 xvfb-run -a "$engine" --path /tmp/brick-stage --rendering-driver vulkan --rendering-method mobile --audio-driver Dummy --script res://test_lie_brick_reference.gd 2>&1 | tee brick-native.log
      - name: Linear radiance errors, independent-seed noise and analytical controls
        run: |
          set -o pipefail
          python tools/lie_brick_reference_compare.py --stage /tmp/brick-stage --output /tmp/brick-comparison | tee brick-comparison.log
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('brick-*.log'):
              text=p.read_text()
              assert not any(v in text for v in ('ERROR:', 'SCRIPT ERROR', 'were leaked at exit')),str(p)+'\n'+text[-5000:]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-brick-independent-reference
          compression-level: 6
          path: |
            brick-*.log
            /tmp/brick-fixture
            /tmp/brick-comparison
            /tmp/brick-stage/brick-reference-native.json
            /tmp/brick-stage/brick-reference-window.png
            /tmp/brick-stage/*.rgba32f
          if-no-files-found: error
