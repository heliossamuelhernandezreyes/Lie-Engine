name: LIE-BRICK02 Scanned Geometry Capture
on:
  push:
    branches: ["experiment/lie-brick02-real-scan-import"]
    paths:
      - '.github/workflows/lie-brick02-scanned.yml'
      - 'tools/lie_brick02_*'
      - 'tests/test_lie_brick02_capture.py'
      - 'gpu_compute/lie_brick02_*'
      - 'gpu_compute/lie_brick01_lab.gd'
      - 'tools/lie_agent_launch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install source processing dependencies
        run: python -m pip install numpy pillow trimesh
      - name: Inspect physical 3D fixture and capture bank ABI
        run: |
          python -m unittest discover -s tests -p 'test_lie_brick02_capture.py' -v
          python tools/lie_brick02_fixture.py --directory /tmp/liebrick02source
          python tools/lie_brick02_capture_scan.py --source /tmp/liebrick02source/SYNTHETIC_NOT_PHOTOGRAMMETRY.glb --provenance /tmp/liebrick02source/provenance.json --output gpu_compute/captures/liebrick02 --hero 25000 --middle 6000 --far 1200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-brick02-synthetic-only-abi
          path: |
            gpu_compute/captures/liebrick02/catalog.json
          if-no-files-found: warn
