name: LIE construction 6.5.0 continuous surfaces APK
on:
  push:
    branches: [work/lie-construction-android, work/lie-surface-continuity-650]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: construction-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: tools
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU regressions and pinned immutable v6 input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --timeout 30 --retries 2 -r requirements-hq.txt
          python -m unittest discover -s tests -p 'test_*.py' -q
          gh api repos/${{ github.repository }}/actions/artifacts/13572886857/zip > /tmp/v6.zip
          python tools/lie_construction_android_input.py --archive /tmp/v6.zip --output /tmp/hq-scene
          python tools/lie_light_field.py
          python tools/lie_field_quality_cases.py
      - name: Native engine, Vulkan and telemetry module
        run: |
          timeout 180 sudo apt-get update -qq
          timeout 180 sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1 libvulkan-dev g++
          g++ -O2 -std=c++17 -Wall -Wextra -Wno-missing-field-initializers native/architecture_audit/replay.cpp -lvulkan -o /tmp/lie-native-replay
          curl --fail --location --retry 2 --max-time 120 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          python tools/lie_hardware_build.py --cache /tmp/lie-native-deps --platform linux.x86_64 > native-probe-build.log 2>&1
          python tools/lie_construction_android_build.py --data /tmp/hq-scene --stage /tmp/mobile-ci
      - name: Restore pinned 6.4.0 code for independent image comparison
        run: |
          git fetch origin 94ac4f1ee225da96155f7e60433f9eaf11408f71 --depth=1
          git worktree add --detach /tmp/lie-baseline 94ac4f1ee225da96155f7e60433f9eaf11408f71
          PYTHONPATH=/tmp/lie-baseline/tools python /tmp/lie-baseline/tools/lie_light_field.py
          PYTHONPATH=/tmp/lie-baseline/tools python /tmp/lie-baseline/tools/lie_field_quality_cases.py
          PYTHONPATH=/tmp/lie-baseline/tools python /tmp/lie-baseline/tools/lie_construction_android_build.py --data /tmp/hq-scene --stage /tmp/baseline-ci
          cp gpu_compute/test_lie_construction_reconstruction.gd /tmp/baseline-ci/
      - name: Compile, controls, actual native construction and mobile comparison
        run: |
          set -o pipefail
          engine=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          timeout 120 "$engine" --headless --path /tmp/mobile-ci --editor --import --quit 2>&1 | tee mobile-import.log
          timeout 120 "$engine" --headless --path /tmp/baseline-ci --editor --import --quit 2>&1 | tee mobile-baseline-import.log
          python tools/lie_surface_continuity_probe.py --stage /tmp/mobile-ci --output surface-continuity --replay /tmp/lie-native-replay --godot "$engine" 2>&1 | tee surface-continuity.log
          timeout 900 xvfb-run -a -s '-screen 0 1280x800x24' "$engine" --path /tmp/baseline-ci --rendering-driver vulkan --rendering-method mobile --audio-driver Dummy --script res://test_lie_construction_reconstruction.gd 2>&1 | tee mobile-baseline-reconstruction.log
          for script in test_lie_visibility_planner test_lie_proxy_physics test_lie_construction_mobile_metrics test_lie_hardware_probe test_lie26_rig workshop/test_lie_agent_session; do
            timeout 90 "$engine" --headless --path /tmp/mobile-ci --script "res://$script.gd" 2>&1 | tee "mobile-${script##*/}.log"
          done
          python tools/lie_visibility_validate.py --stage /tmp/mobile-ci
          native_status=0
          for script in test_lie_native_visibility_gpu test_lie_proxy_gpu test_lie_hierarchy_gpu test_lie_construction_reconstruction test_lie_hq_construction test_lie_construction_field test_lie_construction_mobile test_lie_surface_mobile; do
            if ! timeout 900 xvfb-run -a -s '-screen 0 1280x800x24' "$engine" --path /tmp/mobile-ci --rendering-driver vulkan --rendering-method mobile --audio-driver Dummy --script "res://$script.gd" 2>&1 | tee "mobile-$script.log"; then native_status=1; fi
          done
          test "$native_status" -eq 0
          python tools/lie_construction_reconstruction_compare.py --baseline /tmp/baseline-ci --candidate /tmp/mobile-ci --output reconstruction-comparison.json
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('mobile-*.log'):
              text=p.read_text();assert not any(x in text for x in ['ERROR:','SCRIPT ERROR','were leaked at exit']),(str(p),text[-15000:])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - name: Build ARM64 module and verify official Android template
        run: |
          python tools/lie_hardware_build.py --cache /tmp/lie-native-deps --platform android.arm64 --ndk "$ANDROID_HOME/ndk/28.2.13676358" > native-android-build.log 2>&1
          curl --fail --location --retry 2 --max-time 180 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/godot-templates.tpz' | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q /tmp/godot-templates.tpz templates/android_debug.apk -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Export, sign, align and independently verify complete APK
        run: |
          keytool -genkeypair -keystore /tmp/lie-construction-debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=LIE Construction Laboratory,O=LIE,C=MX' -keyalg RSA -keysize 2048 -validity 10000
          python tools/lie_construction_android_build.py --data /tmp/hq-scene --stage /tmp/mobile-export --godot /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --sdk "$ANDROID_HOME" --keystore /tmp/lie-construction-debug.keystore --output "$PWD/apk/LIE-Construccion-v6.5.0.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk/LIE-Construccion-v6.5.0.apk > apk/badging.txt
          python tools/lie_construction_apk_verify.py --apk apk/LIE-Construccion-v6.5.0.apk --badging apk/badging.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-construction-v650-apk-and-evidence
          compression-level: 6
          path: |
            apk/
            *.log
            /tmp/mobile-ci/construction-mobile-ui.png
            /tmp/mobile-ci/construction-mobile-native.json
            /tmp/mobile-ci/hq-construction-native.json
            /tmp/mobile-ci/construction-field-native.json
            /tmp/mobile-ci/hardware-probe-native.json
            /tmp/mobile-ci/construction-reconstruction-native.json
            /tmp/mobile-ci/reconstruction-case*.png
            /tmp/baseline-ci/construction-reconstruction-native.json
            /tmp/baseline-ci/reconstruction-case*.png
            reconstruction-comparison.json
            surface-continuity.log
            surface-continuity/surface-continuity-results.json
            surface-continuity/*/*.log
            /tmp/mobile-ci/surface-continuity-mobile.json
            /tmp/mobile-ci/surface-continuity-ui.png
            /tmp/mobile-ci/surface-continuous.png
            /tmp/mobile-ci/surface-legacy.png
            /tmp/mobile-ci/surface-full-brick-ui.png
            /tmp/mobile-ci/construction-proxy-physics.json
            /tmp/mobile-ci/construction-proxy-native.json
            /tmp/mobile-ci/construction-proxy-ui.png
            /tmp/mobile-ci/construction-hierarchy-native.json
            /tmp/mobile-ci/construction-hierarchy-ui.png
            /tmp/mobile-ci/hierarchy-case*.png
            /tmp/mobile-ci/construction-native-visibility.json
            /tmp/mobile-ci/construction-native-visibility-ui.png
            /tmp/mobile-ci/native-visibility-*.png
            /tmp/mobile-ci/native-visibility-planning.json
            /tmp/mobile-ci/native-visibility-validation.json
            /tmp/mobile-ci/native-plan-*.bin
            gpu_compute/addons/lie_gpu_probe/bin/*/build.json
          if-no-files-found: warn
