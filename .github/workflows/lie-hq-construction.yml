name: LIE photographic construction and shared banks
on:
  push:
    branches: [work/lie-hq-corner]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hq-construction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: tools
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and CPU regressions
        run: |
          python -m pip install --timeout 30 --retries 2 -r requirements-hq.txt
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Native engine and attributed v3 brick bank
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          timeout 180 sudo apt-get update -qq
          timeout 180 sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libsm6 libgl1 libegl1 libxkbcommon0
          curl --fail --location --retry 2 --max-time 90 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          gh api repos/${{ github.repository }}/actions/artifacts/13561956327/zip > /tmp/v3.zip
          python - <<'PY'
          import hashlib,zipfile,pathlib,shutil,json
          p=pathlib.Path('/tmp/v3.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f848ed1abf78606b36cc1843d3ba82a5933e354cc25014f0c1c0b4f56438e688'
          with zipfile.ZipFile(p) as z:z.extractall('/tmp/v3')
          for path in pathlib.Path('/tmp/v3').rglob('catalog.json'):
              try:d=json.loads(path.read_text())
              except Exception:continue
              if d.get('sha256')=='dbdf7b21727d4ee9c789dd8cdedde29c42297deae359e5089315b1a744160916':
                  shutil.copytree(path.parent,'/tmp/hq/base');break
          assert pathlib.Path('/tmp/hq/base/library.bin').stat().st_size==60262400
          PY
      - name: Original 8K sources, closed component geometry and shared-bank sets
        run: |
          python tools/lie_hq_construction_ci_sources.py --output /tmp/hq/materials
          python tools/lie_hq_construction_sources.py --materials /tmp/hq/materials --output /tmp/hq/sources
          python tools/lie_hq_construction_bank.py --base /tmp/hq/base --sources /tmp/hq/sources --output /tmp/hq/scene
          python tools/lie_hq_construction_sets.py --root /tmp/hq/scene
          python tools/lie_hq_construction_audit.py --root /tmp/hq/scene --sources /tmp/hq/sources
          python tools/lie_hq_construction_stage.py --data /tmp/hq/scene --output /tmp/hq/stage
      - name: Native rig, agent, multi-bank depth, optical normals and joint checks
        run: |
          set -o pipefail
          engine=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          timeout 120 "$engine" --headless --path /tmp/hq/stage --editor --import --quit 2>&1 | tee hq-construction-import.log
          timeout 60 "$engine" --headless --path /tmp/hq/stage --script res://test_lie26_rig.gd 2>&1 | tee hq-construction-rig.log
          timeout 60 "$engine" --headless --path /tmp/hq/stage --script res://workshop/test_lie_agent_session.gd 2>&1 | tee hq-construction-agent.log
          timeout 600 xvfb-run -a "$engine" --path /tmp/hq/stage --rendering-driver vulkan --rendering-method mobile --audio-driver Dummy --script res://test_lie_hq_construction.gd 2>&1 | tee hq-construction-native.log
          python tools/lie_hq_construction_verify.py --sources /tmp/hq/sources --stage /tmp/hq/stage --output /tmp/hq/comparison
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('hq-construction-*.log'):
              t=p.read_text();assert not any(x in t for x in ('ERROR:','SCRIPT ERROR','were leaked at exit')),t[-6000:]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-hq-construction
          compression-level: 6
          path: |
            hq-construction-*.log
            /tmp/hq/scene/banks
            /tmp/hq/scene/*.json
            /tmp/hq/sources/manifest.json
            /tmp/hq/sources/mortar-*.png
            /tmp/hq/sources/mortar-region-review.json
            /tmp/hq/stage/*.png
            /tmp/hq/stage/hq-construction-native.json
            /tmp/hq/comparison
          if-no-files-found: warn
