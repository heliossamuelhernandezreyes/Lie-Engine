name: Persist verified LIE-MORTAR-01 8K extraction evidence
on:
  push:
    branches: ["experiment/lie-wall04-real-mortar-plan"]
    paths: [".github/workflows/lie-mortar01-persist.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  persist-captured-mortar-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover the SHA-verified original 8K extraction run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lie-mortar-proof
          gh run download 38406210503 --repo "${{ github.repository }}" \
            --name lie-mortar01-authentic-source-unreviewed --dir /tmp/lie-mortar-proof
          find /tmp/lie-mortar-proof -type f | wc -l
      - name: Verify source 8K identity and label every result UNREVIEWED
        run: |
          python - <<'PY'
          import json,pathlib
          P=pathlib.Path
          root=P('/tmp/lie-mortar-proof')
          locked=json.loads((root/'source/source-lock.json').read_text())
          report=json.loads((root/'derived/mortar-unreviewed-report.json').read_text())
          assert locked['schema']=='lie-source-lock/1.0'
          assert locked['license']=='CC0-1.0'
          assert locked['source_page']=='https://polyhaven.com/a/brick_wall_13'
          assert locked['resolution']=='8k'
          assert locked['dimensions']==[8192,8192]
          assert set(['color','height','normal_gl','roughness','ao']) <= set(locked['files'])
          assert report['source_sha256']=={name:v['sha256'] for name,v in locked['files'].items()}
          assert report['material_id']==locked['material_id']
          assert not report['human_mask_reviewed'] and not report['certified_mortar_only']
          assert not report['absolute_displacement_mm_verified']
          assert len(report['candidate_crops'])>=4
          assert (root/'derived/mortar-unreviewed-overlay.png').stat().st_size>10000
          assert (root/'derived/mortar-unreviewed-mask.png').stat().st_size>10000
          for part in report['candidate_crops']:
            assert part['status']=='unreviewed'
            assert all((root/'derived'/file).is_file() for file in part['source_files'].values())
          print('Recovered REAL 8K maps verified by prior run; G1 still NOT PASSED')
          PY
      - name: Commit source lock, mask, overlay, aligned candidate crops and review report
        run: |
          BASE='assets/material_masters/mortar/hero/real_masonry_joint'
          mkdir -p "$BASE/source" "$BASE/derived"
          cp /tmp/lie-mortar-proof/source/source-lock.json "$BASE/source/source-lock.json"
          cp /tmp/lie-mortar-proof/derived/* "$BASE/derived/"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f "$BASE/source/source-lock.json" "$BASE/derived/"
          if git diff --cached --quiet; then
            echo 'Identical photographic diagnostics were already persisted'
          else
            git commit -m 'LIE-MORTAR-01: persist authentic 8K CC0 evidence and UNREVIEWED joints [skip ci]'
            git fetch origin experiment/lie-wall04-real-mortar-plan
            git rebase origin/experiment/lie-wall04-real-mortar-plan
            git push origin HEAD:experiment/lie-wall04-real-mortar-plan
          fi
