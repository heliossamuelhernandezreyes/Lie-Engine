name: LIE WALL04 Android mobile renderer
on:
  push:
    branches: ["work/lie-runtime-lighting-hardening"]
    paths:
      - ".github/workflows/lie-runtime-android.yml"
      - "gpu_compute/lie_runtime_android*"
      - "gpu_compute/test_lie_runtime_android.gd"
      - "tools/lie_runtime_android_build.py"
      - "tools/lie_android_manifest.py"
      - "tools/licenses/**"
  pull_request:
    paths:
      - ".github/workflows/lie-runtime-android.yml"
      - "gpu_compute/lie_runtime_android*"
      - "gpu_compute/test_lie_runtime_android.gd"
      - "tools/lie_runtime_android_build.py"
      - "tools/lie_android_manifest.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lie-android-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real-wall-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare real immutable WALL04 bank and isolated phone project
        run: |
          python -m pip install -r requirements-ci.txt
          python tools/lie_wall04_compose.py --restore
          python tools/lie_runtime_android_build.py --stage /tmp/lie-wall-android-ci
      - name: Install Godot 4.7.2 and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1
          curl --fail --location --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir godot-bin
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Compile isolated project and verify actual Mobile compositor
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/lie-wall-android-ci --editor --import --quit > android-import.log 2>&1
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' \
            godot-bin/Godot_v4.7.2-stable_linux.x86_64 --path /tmp/lie-wall-android-ci \
            --rendering-driver vulkan --rendering-method mobile --audio-driver Dummy \
            --script res://test_lie_runtime_android.gd 2>&1 | tee android-mobile-native.log
          python - <<'PY'
          from pathlib import Path
          for name in ['android-import.log','android-mobile-native.log']:
            text=Path(name).read_text()
            assert 'ERROR:' not in text and 'were leaked at exit' not in text, text[-10000:]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-wall04-android-mobile-native
          path: |
            android-import.log
            android-mobile-native.log
            /tmp/lie-wall-android-ci/lie-runtime-android-native.json
          if-no-files-found: error
