name: LIE analytic first-hit exhaustive acceptance

on:
  push:
    branches: [research/lie-geometric-sufficiency-audit]
    paths:
      - '.github/workflows/lie-stream-analytic-first-hit.yml'
      - 'tools/shaders/lie_stream_first_hit_analytic.comp.glsl'
      - 'tools/lie_cell_sheet_reference.py'
      - 'tools/lie_stream_exhaustive_compare.py'
      - 'tools/lie_stream_first_hit_stage.py'
      - 'tests/test_lie_cell_sheet_reference.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-attributed-wall:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIE_EXPERIMENT: experiment
      LIE_STAGE: /tmp/lie-native-qa
    steps:
      - name: Checkout geometry audit branch
        uses: actions/checkout@v4
      - name: Checkout untouched native LIE experimental branch
        uses: actions/checkout@v4
        with:
          ref: 0aa2d1db2612902acca4814ec1c1f0f991f921bf
          path: experiment
      - name: Download verified public LIE 2.5 APK and historical evidence
        uses: actions/download-artifact@v4
        with:
          name: lie-captured-views-apk-and-evidence
          run-id: 39371606348
          repository: heliossamuelhernandezreyes/Lie-Engine
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lie-original-apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bank/compiler dependencies and software Vulkan
        run: |
          python -m pip install numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools unzip
      - name: Recover 39 attributed capture files and verify original hashes
        run: |
          find "${{ runner.temp }}/lie-original-apk" -name '*.apk' -type f -print
          APK="$(find "${{ runner.temp }}/lie-original-apk" -name '*.apk' -type f | head -1)"
          test -n "$APK"
          python tools/lie_recover_attributed_apk_bank.py \
            --apk "$APK" \
            --out "$LIE_EXPERIMENT/gpu_compute/captures/liewall06" \
            --report "${{ runner.temp }}/lie-bank-recovery.json"
      - name: Rebuild exact native shaders and captured-cell rectangles
        run: |
          python "$LIE_EXPERIMENT/tools/lie_direct_access_shaders.py"
          python "$LIE_EXPERIMENT/tools/lie_direct_views_shaders.py"
          python "$LIE_EXPERIMENT/tools/lie_native_shaders.py"
          python "$LIE_EXPERIMENT/tools/lie_native_surface.py"
          python "$LIE_EXPERIMENT/tools/lie_native_stage.py" --stage "$LIE_STAGE"
      - name: Install pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=$GITHUB_WORKSPACE/godot-bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import staged test project and verify Vulkan driver
        run: |
          "$GODOT" --headless --path "$LIE_STAGE" --editor --import --quit > "${{ runner.temp }}/lie-import.log" 2>&1
          cat "${{ runner.temp }}/lie-import.log"
          vulkaninfo --summary || true
      - name: Execute native RenderingDevice Vulkan at three failure camera poses
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          xvfb-run -a "$GODOT" --path "$LIE_STAGE" --rendering-driver vulkan --rendering-method mobile \
            --audio-driver Dummy --script res://test_lie_native_depth.gd \
            > "${{ runner.temp }}/lie-native-gpu.log" 2>&1 || { cat "${{ runner.temp }}/lie-native-gpu.log"; exit 1; }
          cat "${{ runner.temp }}/lie-native-gpu.log"
          test -s "$LIE_STAGE/native-depth/0-native-world.bin"
          test -s "$LIE_STAGE/native-depth/0-native-views.bin"
          test -s "$LIE_STAGE/native-depth/0-native-proxies.bin"
      - name: Compare actual Vulkan against independent captured-cell ray oracle
        run: |
          for pose in 0 1 2; do
            python tools/lie_real_vulkan_triplet.py \
              --captures "$LIE_STAGE/native-depth" \
              --bank "$LIE_EXPERIMENT/gpu_compute/captures/liewall06" \
              --experimental-checkout "$LIE_EXPERIMENT" \
              --pose "$pose" \
              --output "${{ runner.temp }}/lie-native-triplet-pose${pose}.json"
          done
      - name: Verify the archived 80-vs-83 float32 boundary inversion
        run: |
          python tools/lie_native_edge_precision_probe.py \
            --captures "$LIE_STAGE/native-depth" \
            --bank "$LIE_EXPERIMENT/gpu_compute/captures/liewall06" \
            --pose 1 --assert-critical \
            --output "${{ runner.temp }}/lie-native-boundary-80-83.json"
      - name: Preserve original GPU baseline and reference
        run: |
          mkdir -p "${{ runner.temp }}/lie-native-before"
          cp "$LIE_STAGE"/native-depth/{0,1,2}-native-world.bin "${{ runner.temp }}/lie-native-before/"
      - name: Adversarial packed-bitset and temporal replay fixtures
        run: python -m unittest discover -s tests -p 'test_lie_stream_candidate_probe.py' -v
      - name: Apply pre-discard candidate atomic instrumentation to STAGED project
        run: |
          python tools/lie_stream_candidate_probe.py --stage "$LIE_STAGE" | tee "${{ runner.temp }}/lie-stream-probe.json"
          grep -q "atomicOr(lie_risk.bits" "$LIE_STAGE/shaders/lie_direct_native.glsl"
          python tools/lie_stream_first_hit_stage.py --stage "$LIE_STAGE" --analytic | tee "${{ runner.temp }}/lie-first-hit-stage.json"
          "$GODOT" --headless --path "$LIE_STAGE" --editor --import --quit \
            > "${{ runner.temp }}/lie-stream-import.log" 2>&1 || { cat "${{ runner.temp }}/lie-stream-import.log"; exit 1; }
          cat "${{ runner.temp }}/lie-stream-import.log"
      - name: Run actual Vulkan RenderingDevice with fragment candidate flags
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          xvfb-run -a "$GODOT" --path "$LIE_STAGE" --rendering-driver vulkan --rendering-method mobile \
            --audio-driver Dummy --script res://test_lie_native_depth.gd \
            > "${{ runner.temp }}/lie-stream-gpu.log" 2>&1 || { cat "${{ runner.temp }}/lie-stream-gpu.log"; exit 1; }
          cat "${{ runner.temp }}/lie-stream-gpu.log"
          for pose in 0 1 2; do
            test -s "$LIE_STAGE/native-depth/$pose-native-candidate-risk.bin"
            test -s "$LIE_STAGE/native-depth/$pose-native-world.bin"
          done
      - name: Evaluate pre-discard candidates and P-frame temporal reprojection
        run: |
          python tools/lie_stream_candidate_metrics.py \
            --captures "$LIE_STAGE/native-depth" \
            --baseline "${{ runner.temp }}/lie-native-before" \
            --diagnostics "${{ runner.temp }}" \
            --output "${{ runner.temp }}/lie-stream-candidate-metrics.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'lie-stream-candidate-metrics.json').read_text())
          assert report['strict_geometry_unchanged'], 'Probe changed native surface geometry; reject instrumentation'
          PY
      - name: Compare GPU compute first-hit against independent captured-cell oracle
        run: |
          for pose in 0 1 2; do
            test -s "$LIE_STAGE/native-depth/$pose-native-first-hit.bin"
            python tools/lie_stream_first_hit_compare.py \
              --captures "$LIE_STAGE/native-depth" \
              --baseline "${{ runner.temp }}/lie-native-before" \
              --bank "$LIE_EXPERIMENT/gpu_compute/captures/liewall06" \
              --experimental-checkout "$LIE_EXPERIMENT" \
              --diagnostics "${{ runner.temp }}" \
              --pose "$pose" --random-flagged 1200 \
              --output "${{ runner.temp }}/lie-stream-first-hit-pose${pose}.json"
          done
      - name: Test independent analytic cell reference
        run: python -m unittest discover -s tests -p 'test_lie_cell_sheet_reference.py' -v
      - name: Require analytic equivalence on ALL flagged pixels and uniform frame sample
        run: |
          result=0
          for pose in 0 1 2; do
            python tools/lie_stream_exhaustive_compare.py \
              --captures "$LIE_STAGE/native-depth" \
              --bank "$LIE_EXPERIMENT/gpu_compute/captures/liewall06" \
              --pose "$pose" --uniform-samples 10000 --require-pass \
              --output "${{ runner.temp }}/lie-analytic-census-pose${pose}.json" || result=1
          done
          exit "$result"
      - name: Keep authenticated evidence, without publishing recovered bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lie-analytic-first-hit-proof-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/lie-bank-recovery.json
            ${{ runner.temp }}/lie-import.log
            ${{ runner.temp }}/lie-native-gpu.log
            ${{ runner.temp }}/lie-native-triplet-pose*.json
            ${{ runner.temp }}/lie-native-boundary-80-83.json
            ${{ runner.temp }}/lie-native-guard-import.log



            ${{ runner.temp }}/lie-native-before/*-native-world.bin
            ${{ runner.temp }}/lie-stream-probe.json
            ${{ runner.temp }}/lie-first-hit-stage.json
            ${{ runner.temp }}/lie-analytic-census-pose*.json
            ${{ runner.temp }}/lie-stream-first-hit-pose*.json
            /tmp/lie-native-qa/native-depth/*-native-first-hit.bin
            ${{ runner.temp }}/lie-stream-import.log
            ${{ runner.temp }}/lie-stream-gpu.log
            ${{ runner.temp }}/lie-stream-candidate-metrics.json
            /tmp/lie-native-qa/native-depth/*-native-candidate-risk.bin
            /tmp/lie-native-qa/native-depth/0-native-world.bin
            /tmp/lie-native-qa/native-depth/0-regions-world.bin
            /tmp/lie-native-qa/native-depth/0-native-views.bin
            /tmp/lie-native-qa/native-depth/0-native-proxies.bin
            /tmp/lie-native-qa/native-depth/1-native-world.bin
            /tmp/lie-native-qa/native-depth/1-regions-world.bin
            /tmp/lie-native-qa/native-depth/1-native-views.bin
            /tmp/lie-native-qa/native-depth/1-native-proxies.bin
            /tmp/lie-native-qa/native-depth/2-native-world.bin
            /tmp/lie-native-qa/native-depth/2-regions-world.bin
            /tmp/lie-native-qa/native-depth/2-native-views.bin
            /tmp/lie-native-qa/native-depth/2-native-proxies.bin
            /tmp/lie-native-qa/native-depth/execution.json
            /tmp/lie-native-qa/native-depth/phone-shadows-native.png
            /tmp/lie-native-qa/native-depth/phone-shadows-regions.png
