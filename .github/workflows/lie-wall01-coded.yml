name: LIE-WALL01 authentic 96-brick node-coded lighting
on:
  push:
    branches: ["experiment/lie-wall01-coded-lighting"]
    paths:
      - '.github/workflows/lie-wall01-coded.yml'
      - 'tools/lie_wall01_*'
      - 'tools/lie_brick02_restore.py'
      - 'tests/test_lie_wall01_coded.py'
      - 'gpu_compute/shaders/lie_wall01_coded.glsl'
      - 'gpu_compute/lie_wall01_*'
      - 'gpu_compute/lie11_light_effect.gd'
      - 'gpu_compute/lie_brick01_lab.gd'
      - 'gpu_compute/workshop/lie_agent_session.gd'
      - 'tools/lie_agent_launch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coded-native-wall:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install source and native device dependencies
        run: |
          python -m pip install numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir godot-bin
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Restore exact CC BY 500k-triangle original-scan samples
        run: python tools/lie_brick02_restore.py
      - name: Bake real scanned brick wall and coded RGB node model
        run: |
          python tools/lie_wall01_bake.py
          python -m unittest discover -s tests -p 'test_lie_wall01_coded.py' -v
      - name: Godot import and check shader/GDScript
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path gpu_compute --editor --import --quit > import.log 2>&1
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path gpu_compute --check-only --script res://lie_wall01_coded_lab.gd >> import.log 2>&1
          cat import.log
          python - <<'PY'
          from pathlib import Path
          text=Path('import.log').read_text()
          assert "SCRIPT ERROR:" not in text,text[-13000:]
          PY
      - name: Render actual Vulkan coded light RGB neutral warm cool and dynamic absorption
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" bash -euc '
            python tools/lie_agent_launch.py --godot "$PWD/godot-bin/Godot_v4.7.2-stable_linux.x86_64" --lab liewall01 --directory /tmp/lie-wall01-native --audio-driver Dummy
            python tools/lie_wall01_native_smoke.py --directory /tmp/lie-wall01-native
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie-wall01-real-scan-original-LIE11-GPU-lighting
          path: |
            import.log
            gpu_compute/captures/liewall01/catalog.json
            gpu_compute/captures/liewall01/light-model.json
            /tmp/lie-wall01-native/*.png
            /tmp/lie-wall01-native/*.json
            /tmp/lie-wall01-native/godot.log
          if-no-files-found: warn
