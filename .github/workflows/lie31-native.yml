name: LIE31 Native Photographic Brick Wall
on:
  push:
    branches: ["experiment/lie31-hd-source-wall"]
    paths:
      - ".github/workflows/lie31-native.yml"
      - "tools/lie31_capture_hd.py"
      - "tools/lie31_native_smoke.py"
      - "gpu_compute/lie31_hd_*"
      - "gpu_compute/workshop/lie_agent_session.gd"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hd-capture-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install native Godot and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir godot-bin
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          python -m pip install numpy pillow
      - name: Recover original LIE30 mortar and verify all source maps
        run: |
          python tools/lie30_restore_bank.py
          python tools/lie31_acquire_pbr.py --directory /tmp/lie31-source --resolution 4k
      - name: Create physically displaced sample bank with 4K real PBR channels
        run: |
          python tools/lie31_capture_hd.py --source /tmp/lie31-source --output gpu_compute/captures/lie31hd
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("gpu_compute/captures/lie31hd/catalog.json").read_text())
          assert c["masters"]["brick"]["levels"][0]["count"]>c["masters"]["brick"]["levels"][1]["count"]*6
          assert c["source_resolution"]==4096
          print("Hero samples:",c["masters"]["brick"]["levels"][0]["count"])
          print("Wall samples:",c["masters"]["brick"]["levels"][1]["count"])
          PY
      - name: Import engine and check native GDScript
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path gpu_compute --editor --import --quit > godot-import.log 2>&1
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path gpu_compute --check-only --script res://lie31_hd_lab.gd >> godot-import.log 2>&1
          cat godot-import.log
          python - <<'PY'
          from pathlib import Path
          s=Path("godot-import.log").read_text()
          assert "SCRIPT ERROR:" not in s, s
          PY
      - name: Render actual LIE31 GPU compositor and validate resulting PNGs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" bash -euc '
            python tools/lie_agent_launch.py --godot "$PWD/godot-bin/Godot_v4.7.2-stable_linux.x86_64" --lab lie31 --directory /tmp/lie31-native --audio-driver Dummy
            python tools/lie31_native_smoke.py --directory /tmp/lie31-native
          '
      - name: Commit verified captured masters and original compositor screenshots
        if: success()
        run: |
          mkdir -p evidence gpu_compute/assets/lie31
          python - <<'PY'
          from pathlib import Path
          import zlib, hashlib
          p=Path("gpu_compute/captures/lie31hd/library.bin")
          compressed=zlib.compress(p.read_bytes(),9)
          Path("gpu_compute/assets/lie31/hd_bank.zlib").write_bytes(compressed)
          print("Compressed:",len(compressed),"bytes",hashlib.sha256(compressed).hexdigest())
          PY
          cp gpu_compute/captures/lie31hd/catalog.json gpu_compute/assets/lie31/catalog.json
          cp gpu_compute/captures/lie31hd/SOURCE_BRICK_CROP.png evidence/LIE31-SOURCE-Crop-Not-A-Render.png
          cp /tmp/lie31-native/LIE31-Wall-Godot.png evidence/LIE31-Wall-Godot.png
          cp /tmp/lie31-native/LIE31-Brick-Closeup-Godot.png evidence/LIE31-Brick-Closeup-Godot.png
          cp /tmp/lie31-native/LIE31-validation.json evidence/LIE31-validation.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f gpu_compute/assets/lie31/hd_bank.zlib gpu_compute/assets/lie31/catalog.json
          git add evidence/LIE31-SOURCE-Crop-Not-A-Render.png evidence/LIE31-Wall-Godot.png evidence/LIE31-Brick-Closeup-Godot.png evidence/LIE31-validation.json
          git commit -m "LIE31: verified real PBR high-density captures and native Godot screenshots [skip ci]"
          git push origin HEAD:experiment/lie31-hd-source-wall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lie31-native-hd-evidence
          path: |
            /tmp/lie31-native/*.png
            /tmp/lie31-native/*.json
            /tmp/lie31-native/godot.log
            gpu_compute/captures/lie31hd/catalog.json
            gpu_compute/captures/lie31hd/SOURCE_BRICK_CROP.png
            godot-import.log
          if-no-files-found: warn
